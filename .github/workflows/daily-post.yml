name: Daily Post Generator

on:
  schedule:
    - cron: "30 3 * * *"  # runs every day at 9:00 AM IST (UTC+5:30)
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Anthropic SDK
        run: npm install @anthropic-ai/sdk

      - name: Generate daily lessons
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/generate-daily-posts.js

      - name: Commit and push new lessons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lessons/ .github/topics.md .github/inbox.md
          git diff --cached --quiet || git commit -m "Daily post: add new lessons [$(date +'%Y-%m-%d')]"
          git push
